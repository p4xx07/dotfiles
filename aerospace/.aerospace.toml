# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []
# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
  'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0',
]

# Start AeroSpace at login
start-at-login = false

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.left = 15
outer.bottom = 15
outer.top = 15
outer.right = 15

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (ISO keyboards only, european keyboards only)
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, cmd-alt

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    # cmd-alt-enter = '''exec-and-forget osascript -e '
    # tell application "Terminal"
    #     do script
    #     activate
    # end tell'
    # '''

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    cmd-alt-slash = 'layout tiles horizontal vertical'
    cmd-alt-comma = 'layout accordion horizontal vertical'

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    cmd-alt-h = 'focus left'
    cmd-alt-j = 'focus down'
    cmd-alt-k = 'focus up'
    cmd-alt-l = 'focus right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    cmd-shift-alt-h = 'move left'
    cmd-shift-alt-j = 'move down'
    cmd-shift-alt-k = 'move up'
    cmd-shift-alt-l = 'move right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    cmd-alt-minus = 'resize smart -50'
    cmd-alt-equal = 'resize smart +50'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    cmd-alt-0 = 'workspace 0'
    cmd-alt-1 = 'workspace 1'
    cmd-alt-2 = 'workspace 2'
    cmd-alt-3 = 'workspace 3'
    cmd-alt-4 = 'workspace 4'
    #alt-5 = 'workspace 5' for ~
    #alt-6 = 'workspace 6'
    #alt-7 = 'workspace 7'
    #alt-8 = 'workspace 8'
    #alt-9 = 'workspace 9' for `
    cmd-alt-a = 'workspace A' # In your config, you can drop workspace bindings that you don't need
    cmd-alt-b = 'workspace B'
    cmd-alt-c = 'workspace C'
    cmd-alt-d = 'workspace D'
    cmd-alt-e = 'workspace E'
    cmd-alt-f = 'workspace F'
    cmd-alt-g = 'workspace G'
    cmd-alt-i = 'workspace I'
    cmd-alt-m = 'workspace M'
    cmd-alt-n = 'workspace N'
    cmd-alt-o = 'workspace O'
    cmd-alt-p = 'workspace P'
    cmd-alt-q = 'workspace Q'
    cmd-alt-r = 'workspace R'
    cmd-alt-s = 'workspace S'
    cmd-alt-t = 'workspace T'
    cmd-alt-u = 'workspace U'
    cmd-alt-v = 'workspace V'
    cmd-alt-w = 'workspace W'
    cmd-alt-x = 'workspace X'
    cmd-alt-y = 'workspace Y'
    cmd-alt-z = 'workspace Z'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    shift-alt-1 = 'move-node-to-workspace 1'
    shift-alt-2 = 'move-node-to-workspace 2'
    shift-alt-3 = 'move-node-to-workspace 3'
    shift-alt-4 = 'move-node-to-workspace 4'
    shift-alt-5 = 'move-node-to-workspace 5'
    shift-alt-6 = 'move-node-to-workspace 6'
    shift-alt-7 = 'move-node-to-workspace 7'
    shift-alt-8 = 'move-node-to-workspace 8'
    shift-alt-9 = 'move-node-to-workspace 9'
    shift-alt-a = 'move-node-to-workspace A'
    shift-alt-b = 'move-node-to-workspace B'
    shift-alt-c = 'move-node-to-workspace C'
    shift-alt-d = 'move-node-to-workspace D'
    shift-alt-e = 'move-node-to-workspace E'
    shift-alt-f = 'move-node-to-workspace F'
    shift-alt-g = 'move-node-to-workspace G'
    shift-alt-i = 'move-node-to-workspace I'
    shift-alt-m = 'move-node-to-workspace M'
    shift-alt-n = 'move-node-to-workspace N'
    shift-alt-o = 'move-node-to-workspace O'
    shift-alt-p = 'move-node-to-workspace P'
    shift-alt-q = 'move-node-to-workspace Q'
    shift-alt-r = 'move-node-to-workspace R'
    shift-alt-s = 'move-node-to-workspace S'
    shift-alt-t = 'move-node-to-workspace T'
    shift-alt-u = 'move-node-to-workspace U'
    shift-alt-v = 'move-node-to-workspace V'
    shift-alt-w = 'move-node-to-workspace W'
    shift-alt-x = 'move-node-to-workspace X'
    shift-alt-y = 'move-node-to-workspace Y'
    shift-alt-z = 'move-node-to-workspace Z'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    cmd-alt-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    shift-alt-tab = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    shift-alt-comma = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/1
    #s = ['layout sticky tiling', 'mode main']

    alt-cmd-alt-h = ['join-with left', 'mode main']
    alt-cmd-alt-j = ['join-with down', 'mode main']
    alt-cmd-alt-k = ['join-with up', 'mode main']
    alt-cmd-alt-l = ['join-with right', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_leave_service_mode']

    down = 'volume down'
    up = 'volume up'
    cmd-alt-down = ['volume set 0', 'mode main']


[[on-window-detected]]
    if.app-id = 'ru.keepcoder.Telegram'
    run = 'move-node-to-workspace Q'

[[on-window-detected]]
    if.app-id = 'net.whatsapp.WhatsApp'
    run = 'move-node-to-workspace W'

[[on-window-detected]]
    if.app-id = 'com.microsoft.teams2'
    run = 'move-node-to-workspace V'

[[on-window-detected]]
	if.app-id = 'app.zen-browser.zen'
	run = 'move-node-to-workspace B'

[[on-window-detected]]
    if.app-id = 'com.mitchellh.ghostty'
    run = 'move-node-to-workspace T'

[[on-window-detected]]
	if.app-id = 'com.microsoft.Outlook'
    run = 'move-node-to-workspace O'

[[on-window-detected]]
	if.app-id = 'net.ankiweb.launcher'
    run = 'move-node-to-workspace A'

[[on-window-detected]]
	if.app-id = 'com.google.Chrome'
    run = 'move-node-to-workspace C'

[[on-window-detected]]
	if.app-id = 'com.todoist.mac.Todoist'
    run = 'move-node-to-workspace 0'

# Move browsers to F

[[on-window-detected]]
	if.app-id = 'org.mozilla.firefox'
    run = 'move-node-to-workspace F'

[[on-window-detected]]
	if.app-id = 'com.google.Chrome'
    run = 'move-node-to-workspace F'

[[on-window-detected]]
    if.app-id = 'company.thebrowser.Browser'
    run = 'move-node-to-workspace F'

[[on-window-detected]]
    if.app-id = 'org.jeffvli.feishin'
    run = 'move-node-to-workspace S'

[workspace-to-monitor-force-assignment]
    T = 'main' 	    # Terminal
    B = 'main' 	    # Browser
    O = 'main' 	    # Outlook
    W = 'secondary' # WhatsApp
    Q = 'secondary' # Telegram
    V = 'secondary' # Teams
    F = 'secondary' # Firefox / other browsers

    P = 3
