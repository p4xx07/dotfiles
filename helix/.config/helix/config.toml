theme = "onedark"

[editor]
line-number = "relative"
mouse = false

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.statusline]
right = ["diagnostics", "selections", "position","position-percentage", "file-encoding"]

[editor.lsp]
# auto-signature-help = true

[keys.normal]
# C-space = "signature_help"
a = ["append_mode", "collapse_selection"]
"A-c" = "copy_selection_on_prev_line"

[keys.select]
"A-," = "flip_selections"

[keys.insert]
C-s = ":w"
C-q = "collapse_selection"
C-space = "signature_help"

[keys.normal.space]
w = ":update"
e = ":bprev"
q = ":quit"
