theme = "onedark"

[editor]
line-number = "relative"
mouse = false

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.statusline]
right = ["diagnostics", "selections", "position","position-percentage", "file-encoding"]

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]

[keys.select]
"A-," = "flip_selections"

[keys.insert]
C-space = "signature_help"

[keys.normal.space]
w = ":update"
r = ":reload"
e = ":bprev"
q = ":quit"

S-g = [":new", ":insert-output lazygit", ":buffer-close!", ":redraw"]
S-d = [":new", ":insert-output lazydocker", ":buffer-close!", ":redraw"]
S-y = [":new", ":insert-output yazi", ":buffer-close!", ":redraw"]
