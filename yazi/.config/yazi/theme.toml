#:schema https://yazi-rs.github.io/schemas/theme.json
# vim:fileencoding=utf-8:foldmethod=marker

# Catppuccin Frappe -- the lightest of Catppuccin's dark variants (base #303446).
#
# Both `dark` and `light` are pinned to the same flavor on purpose: Yazi probes the
# terminal background to pick between its built-in theme-dark/theme-light presets,
# and the light preset ships deliberately darkened icon colors. Pinning both means
# the look never flips, whatever the terminal (or macOS) reports.
#
# Swap to a darker variant by changing both names to catppuccin-macchiato (#24273a)
# or catppuccin-mocha (#1e1e2e), then run:
#   ya pkg add yazi-rs/flavors:catppuccin-macchiato
#
# Anything added below [flavor] overrides the flavor for that key only.

[flavor]
dark  = "catppuccin-frappe"
light = "catppuccin-frappe"
